name: chess-crawl

x-python: &python
  image: chess-crawl:local
  build:
    context: .
  init: true
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-database-env: &database-env
  CHESS_CRAWL_DATABASE_URL: ${CHESS_CRAWL_DATABASE_URL:-postgresql://chess_crawl@postgres:5432/chess_crawl}
  CHESS_CRAWL_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
  # This explicit policy trusts only the bundled Compose service hostname.
  CHESS_CRAWL_DATABASE_TRANSPORT: local
  CHESS_CRAWL_DATABASE_TRUSTED_HOST: postgres
  CHESS_CRAWL_ARCHIVE_BACKEND: local
  CHESS_CRAWL_ARCHIVE_DIRECTORY: /var/lib/chess-crawl/archive

x-budget-env: &budget-env
  CHESS_CRAWL_JOB_MAX_GAMES: ${CHESS_CRAWL_JOB_MAX_GAMES:-100000}
  CHESS_CRAWL_JOB_MAX_NORMALIZATION_UNITS: ${CHESS_CRAWL_JOB_MAX_NORMALIZATION_UNITS:-100000}
  CHESS_CRAWL_JOB_MAX_REMOTE_BYTES: ${CHESS_CRAWL_JOB_MAX_REMOTE_BYTES:-268435456}
  CHESS_CRAWL_JOB_MAX_REMOTE_REQUESTS: ${CHESS_CRAWL_JOB_MAX_REMOTE_REQUESTS:-2000}
  CHESS_CRAWL_MAX_RESPONSE_BYTES: ${CHESS_CRAWL_MAX_RESPONSE_BYTES:-16777216}
  CHESS_CRAWL_WORKSPACE_MAX_GAMES: ${CHESS_CRAWL_WORKSPACE_MAX_GAMES:-1000000}
  CHESS_CRAWL_WORKSPACE_MAX_NORMALIZATION_UNITS: ${CHESS_CRAWL_WORKSPACE_MAX_NORMALIZATION_UNITS:-1000000}
  CHESS_CRAWL_WORKSPACE_MAX_REMOTE_BYTES: ${CHESS_CRAWL_WORKSPACE_MAX_REMOTE_BYTES:-2147483648}
  CHESS_CRAWL_WORKSPACE_MAX_REMOTE_REQUESTS: ${CHESS_CRAWL_WORKSPACE_MAX_REMOTE_REQUESTS:-10000}
  CHESS_CRAWL_WORKSPACE_MAX_ACTIVE_JOBS: ${CHESS_CRAWL_WORKSPACE_MAX_ACTIVE_JOBS:-2}
  CHESS_CRAWL_WORKSPACE_MAX_QUEUED_JOBS: ${CHESS_CRAWL_WORKSPACE_MAX_QUEUED_JOBS:-32}

services:
  archive-init:
    <<: *python
    user: "0:0"
    cap_add: [CHOWN, FOWNER]
    command: ["python", "/app/docker/archive_init.py"]
    volumes:
      - archive_data:/var/lib/chess-crawl/archive
    restart: "no"

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: chess_crawl
      POSTGRES_DB: chess_crawl
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      # PostgreSQL 18 places its versioned data directory beneath this mount.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 60s

  init:
    <<: *python
    command: ["python", "-m", "chess_crawl.operations", "migrate"]
    environment: *database-env
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *python
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      archive-init:
        condition: service_completed_successfully
    volumes:
      - archive_data:/var/lib/chess-crawl/archive:ro
    environment:
      <<: [*database-env, *budget-env]
      CHESS_CRAWL_API_TOKEN_FILE: /run/secrets/api_token
      CHESS_CRAWL_MAX_GAMES: ${CHESS_CRAWL_MAX_GAMES:-1000}
      CHESS_CRAWL_MAX_DEPTH: ${CHESS_CRAWL_MAX_DEPTH:-2}
      CHESS_CRAWL_MAX_USERS: ${CHESS_CRAWL_MAX_USERS:-100}
      CHESS_CRAWL_MAX_JOBS: ${CHESS_CRAWL_MAX_JOBS:-200}
      CHESS_CRAWL_PAGE_SIZE: ${CHESS_CRAWL_PAGE_SIZE:-100}
      CHESS_CRAWL_MAX_DATE_SPAN_DAYS: ${CHESS_CRAWL_MAX_DATE_SPAN_DAYS:-366}
      CHESS_CRAWL_MAX_WORKING_SET_MEMBERS: ${CHESS_CRAWL_MAX_WORKING_SET_MEMBERS:-10000}
    secrets:
      - postgres_password
      - api_token
    ports:
      - "${CHESS_CRAWL_BIND_ADDRESS:-127.0.0.1}:${CHESS_CRAWL_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py", "api"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *python
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      archive-init:
        condition: service_completed_successfully
    volumes:
      - archive_data:/var/lib/chess-crawl/archive
    command:
      - python
      - -m
      - chess_crawl.jobs.worker
      - --poll-interval
      - "${CHESS_CRAWL_POLL_INTERVAL:-1}"
      - --heartbeat-interval
      - "${CHESS_CRAWL_HEARTBEAT_INTERVAL:-5}"
      - --max-retries
      - "${CHESS_CRAWL_JOB_MAX_RETRIES:-3}"
      - --retry-base
      - "${CHESS_CRAWL_RETRY_BASE:-30}"
      - --retry-max
      - "${CHESS_CRAWL_RETRY_MAX:-3600}"
    environment:
      <<: [*database-env, *budget-env]
      CHESS_CRAWL_CONTACT: ${CHESS_CRAWL_CONTACT:-set-me@example.invalid}
      CHESS_CRAWL_LICHESS_TOKEN: ${CHESS_CRAWL_LICHESS_TOKEN:-}
      CHESS_CRAWL_LICHESS_CLOCKS: ${CHESS_CRAWL_LICHESS_CLOCKS:-true}
      CHESS_CRAWL_LICHESS_EVALS: ${CHESS_CRAWL_LICHESS_EVALS:-true}
      CHESS_CRAWL_LICHESS_ACCURACY: ${CHESS_CRAWL_LICHESS_ACCURACY:-true}
    secrets:
      - postgres_password
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py", "worker"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  events:
    <<: *python
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      mercure:
        condition: service_healthy
    command: ["python", "-m", "chess_crawl.events.publisher"]
    environment:
      <<: *database-env
      CHESS_CRAWL_MERCURE_URL: http://mercure/.well-known/mercure
      CHESS_CRAWL_MERCURE_PUBLISHER_JWT_FILE: /run/secrets/mercure_publisher_jwt
      CHESS_CRAWL_MERCURE_TOPIC_PREFIX: ${CHESS_CRAWL_MERCURE_TOPIC_PREFIX:-https://chess-crawl.local}
    secrets:
      - postgres_password
      - mercure_publisher_jwt
    stop_grace_period: 30s

  mercure:
    image: dunglas/mercure:v0.24.2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/chess-crawl/mercure-entrypoint.sh"]
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_ALG: HS256
      MERCURE_SUBSCRIBER_JWT_ALG: HS256
      MERCURE_EXTRA_DIRECTIVES: |
        transport bolt {
          path /data/mercure.db
          size ${CHESS_CRAWL_MERCURE_HISTORY_SIZE:-10000}
        }
    secrets:
      - mercure_signing_key
    volumes:
      - mercure_data:/data
      - mercure_config:/config
      - ./docker/mercure-entrypoint.sh:/etc/chess-crawl/mercure-entrypoint.sh:ro
    ports:
      - "${CHESS_CRAWL_BIND_ADDRESS:-127.0.0.1}:${CHESS_CRAWL_MERCURE_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/mercure/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  archive_data:
  postgres_data:
  mercure_data:
  mercure_config:

secrets:
  postgres_password:
    file: ${CHESS_CRAWL_SECRETS_DIR:-./data/dev-secrets}/postgres_password
  api_token:
    file: ${CHESS_CRAWL_SECRETS_DIR:-./data/dev-secrets}/api_token
  mercure_signing_key:
    file: ${CHESS_CRAWL_SECRETS_DIR:-./data/dev-secrets}/mercure_signing_key
  mercure_publisher_jwt:
    file: ${CHESS_CRAWL_SECRETS_DIR:-./data/dev-secrets}/mercure_publisher_jwt
