name: CI

on:
  pull_request:
    # Retargeting changes the merge result and promotion policy without a push.
    types: [opened, synchronize, reopened, edited]
    branches:
      - dev
      - 'work/**'
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promotion-source:
    name: Require dev -> master
    if: github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Check promotion source
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          echo "base_ref=${BASE_REF}"
          echo "head_ref=${HEAD_REF}"
          if [ "${BASE_REF}" != "master" ] || [ "${HEAD_REF}" != "dev" ] || [ "${HEAD_REPOSITORY}" != "${BASE_REPOSITORY}" ]; then
            echo "Only pull requests from this repository's dev to master are accepted for promotion."
            exit 1
          fi

  offline-checks:
    name: Offline checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: promotion-source
    # The promotion gate is intentionally skipped for development PRs.
    if: ${{ always() && !cancelled() && (github.base_ref != 'master' || needs.promotion-source.result == 'success') }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy .

      - name: Offline tests
        run: uv run python -m pytest -q -m "not live and not slow"

      - name: Packaged CLI help
        run: uv run chess-crawl --help

  compose-smoke:
    name: Compose API and Mercure smoke
    runs-on: ubuntu-latest
    needs: promotion-source
    if: ${{ always() && !cancelled() && (github.base_ref != 'master' || needs.promotion-source.result == 'success') }}
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create disposable development secrets
        run: python scripts/bootstrap_dev.py

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Exercise API, worker, and durable private Mercure delivery
        run: python scripts/compose_smoke.py

      - name: Service diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Remove disposable containers and archive
        if: always()
        run: docker compose down --volumes --remove-orphans
