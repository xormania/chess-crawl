name: CI

on:
  pull_request:
    # Retargeting changes the merge result and promotion policy without a push.
    types: [opened, synchronize, reopened, edited]
    branches:
      - dev
      - 'work/**'
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promotion-source:
    name: Require dev -> master
    if: github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check promotion source
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          echo "base_ref=${BASE_REF}"
          echo "head_ref=${HEAD_REF}"
          if [ "${BASE_REF}" != "master" ] || [ "${HEAD_REF}" != "dev" ] || [ "${HEAD_REPOSITORY}" != "${BASE_REPOSITORY}" ]; then
            echo "Only pull requests from this repository's dev to master are accepted for promotion."
            exit 1
          fi

  offline-checks:
    name: Offline checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: promotion-source
    # Keep required jobs observable even when a prerequisite fails.
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 10
    env:
      CI_PERFORMANCE_DIR: ${{ github.workspace }}/.ci-performance
      CI_VARIANT: python-${{ matrix.python-version }}
      CHESS_CRAWL_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      CHESS_CRAWL_TEST_DATABASE_PASSWORD: ci-disposable-password
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout merge result and its parents
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine affected checks
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python .github/scripts/ci_scope.py --base-ref "$BASE_REF"

      - name: Validate CI prerequisites
        env:
          SCOPE_RESULT: ${{ steps.scope.outcome }}
          RUN_CHECK: ${{ steps.scope.outputs.offline }}
          BASE_REF: ${{ github.base_ref }}
          PROMOTION_RESULT: ${{ needs.promotion-source.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$RUN_CHECK" = true || test "$RUN_CHECK" = false
          test "$BASE_REF" != master || test "$PROMOTION_RESULT" = success
          echo "Offline checks selected: $RUN_CHECK" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: steps.scope.outputs.offline == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start disposable PostgreSQL
        if: steps.scope.outputs.offline == 'true'
        env:
          POSTGRES_PASSWORD: ${{ env.CHESS_CRAWL_TEST_DATABASE_PASSWORD }}
        run: python .github/scripts/ci_performance.py measure --label postgres-ready --output-dir "$CI_PERFORMANCE_DIR" -- python .github/scripts/test_postgres.py start

      - name: Set up uv
        if: steps.scope.outputs.offline == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.19"
          # These prebuilt dependencies showed no benefit from restoring
          # and saving uv's pruned metadata cache on hosted runners.
          enable-cache: false

      - name: Cache Mypy analysis
        id: mypy-cache
        if: steps.scope.outputs.offline == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-

      - name: Install dependencies
        if: steps.scope.outputs.offline == 'true'
        run: python .github/scripts/ci_performance.py measure --label sync --output-dir "$CI_PERFORMANCE_DIR" -- uv sync --locked --group dev

      - name: Ruff
        if: steps.scope.outputs.offline == 'true' && matrix.python-version == '3.11'
        run: python .github/scripts/ci_performance.py measure --label ruff --output-dir "$CI_PERFORMANCE_DIR" -- uv run --no-sync ruff check . .github/scripts

      - name: Bandit
        if: steps.scope.outputs.offline == 'true' && matrix.python-version == '3.11'
        run: python .github/scripts/ci_performance.py measure --label bandit --output-dir "$CI_PERFORMANCE_DIR" -- uv run --no-sync python .github/scripts/check_bandit.py

      - name: Mypy
        if: steps.scope.outputs.offline == 'true'
        env:
          CI_CACHE_STATE: ${{ steps.mypy-cache.outputs.cache-hit == 'true' && 'exact' || (steps.mypy-cache.outputs.cache-matched-key != '' && 'prefix' || 'cold') }}
        run: python .github/scripts/ci_performance.py measure --label mypy --output-dir "$CI_PERFORMANCE_DIR" -- uv run --no-sync mypy . .github/scripts

      - name: Offline tests
        if: steps.scope.outputs.offline == 'true'
        run: python .github/scripts/ci_performance.py measure --label offline-tests --output-dir "$CI_PERFORMANCE_DIR" -- uv run --no-sync python -m pytest -q -m "not live and not slow" --durations=15 --junitxml="$CI_PERFORMANCE_DIR/pytest.xml"

      - name: Packaged CLI help
        if: steps.scope.outputs.offline == 'true'
        run: python .github/scripts/ci_performance.py measure --label cli-help --output-dir "$CI_PERFORMANCE_DIR" -- uv run --no-sync chess-crawl --help

      - name: Remove disposable PostgreSQL
        if: always() && steps.scope.outputs.offline == 'true'
        run: python .github/scripts/ci_performance.py measure --label postgres-cleanup --output-dir "$CI_PERFORMANCE_DIR" -- python .github/scripts/test_postgres.py stop

      - name: Save Mypy analysis
        if: steps.scope.outputs.offline == 'true' && steps.mypy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .mypy_cache
          key: ${{ steps.mypy-cache.outputs.cache-primary-key }}

      - name: Summarize performance measurements
        if: always() && steps.scope.outputs.offline == 'true'
        run: python .github/scripts/ci_performance.py report --output-dir "$CI_PERFORMANCE_DIR"

      - name: Upload performance evidence
        if: always() && steps.scope.outputs.offline == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-performance-python-${{ matrix.python-version }}-attempt-${{ github.run_attempt }}
          path: ${{ env.CI_PERFORMANCE_DIR }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  compose-smoke:
    name: Compose API and Mercure smoke
    runs-on: ubuntu-latest
    needs: promotion-source
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 12
    env:
      CI_PERFORMANCE_DIR: ${{ github.workspace }}/.ci-performance
      CI_VARIANT: compose
      COMPOSE_FILE: compose.yaml:.github/compose.ci.yaml
    steps:
      - name: Checkout merge result and its parents
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine affected checks
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python .github/scripts/ci_scope.py --base-ref "$BASE_REF"

      - name: Validate CI prerequisites
        env:
          SCOPE_RESULT: ${{ steps.scope.outcome }}
          RUN_CHECK: ${{ steps.scope.outputs.compose }}
          BASE_REF: ${{ github.base_ref }}
          PROMOTION_RESULT: ${{ needs.promotion-source.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$RUN_CHECK" = true || test "$RUN_CHECK" = false
          test "$BASE_REF" != master || test "$PROMOTION_RESULT" = success
          echo "Compose smoke selected: $RUN_CHECK" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: steps.scope.outputs.compose == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create disposable development secrets
        if: steps.scope.outputs.compose == 'true'
        run: python scripts/bootstrap_dev.py

      - name: Validate Compose configuration
        if: steps.scope.outputs.compose == 'true'
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
          python .github/scripts/ci_performance.py measure --label compose-config --output-dir "$CI_PERFORMANCE_DIR" -- python .github/scripts/check_compose_ci.py

      - name: Build application and pull infrastructure concurrently
        if: steps.scope.outputs.compose == 'true'
        run: |
          python .github/scripts/ci_performance.py measure --label mercure-pull --output-dir "$CI_PERFORMANCE_DIR" -- docker compose pull mercure postgres &
          pull_pid=$!
          build_status=0
          python .github/scripts/ci_performance.py measure --label image-build --output-dir "$CI_PERFORMANCE_DIR" -- docker compose build api || build_status=$?
          pull_status=0
          wait "$pull_pid" || pull_status=$?
          test "$build_status" -eq 0 && test "$pull_status" -eq 0

      - name: Start the stack
        if: steps.scope.outputs.compose == 'true'
        run: python .github/scripts/ci_performance.py measure --label stack-ready --output-dir "$CI_PERFORMANCE_DIR" -- docker compose up --no-build --detach --wait --wait-timeout 120

      - name: Exercise API, worker, and durable private Mercure delivery
        if: steps.scope.outputs.compose == 'true'
        run: python .github/scripts/ci_performance.py measure --label compose-smoke --output-dir "$CI_PERFORMANCE_DIR" -- python scripts/compose_smoke.py

      - name: Service diagnostics
        if: failure() && steps.scope.outputs.compose == 'true'
        run: docker compose logs --no-color --tail 100

      - name: Remove disposable containers and database
        if: always() && steps.scope.outputs.compose == 'true'
        run: python .github/scripts/ci_performance.py measure --label cleanup --output-dir "$CI_PERFORMANCE_DIR" -- docker compose down --volumes --remove-orphans

      - name: Summarize performance measurements
        if: always() && steps.scope.outputs.compose == 'true'
        run: python .github/scripts/ci_performance.py report --output-dir "$CI_PERFORMANCE_DIR"

      - name: Upload performance evidence
        if: always() && steps.scope.outputs.compose == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-performance-compose-attempt-${{ github.run_attempt }}
          path: ${{ env.CI_PERFORMANCE_DIR }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
