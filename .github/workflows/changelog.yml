name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout merge result and its parents
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check changed files and changelog entry
        run: python .github/scripts/check_changelog.py
