global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 360s
    timeout server 360s

resolvers docker
    nameserver embedded 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend api
    bind :8080
    default_backend api_replicas

backend api_replicas
    balance roundrobin
    # Resolve replica changes without restarting the proxy. Authentication stays
    # in the API; do not expose authenticated readiness credentials to this probe.
    server-template api 32 api:8000 check resolvers docker init-addr libc,none
